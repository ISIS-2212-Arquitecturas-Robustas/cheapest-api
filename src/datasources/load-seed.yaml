load:
  # Estrategia POST / ASR 2: escritura transaccional bajo demanda concentrada.
  # El 10% de tiendas, zonas y productos concentra aproximadamente el 90%
  # de la actividad. La tienda y los productos fijos del sampler pertenecen
  # a esa cabeza caliente.
  tiendas: 100
  zonas: 5

  distribucion:
    tipo: pareto
    peso_cabeza: 0.9
    fraccion_cabeza: 0.1

  # Logistica: un historial e indices ya poblados evitan medir una base vacia.
  productos: 10000
  catalogos: 500
  catalogos_productos: 100000
  promociones: 1000
  pedidos: 50000
  items_pedido: 250000
  despachos: 30000
  disponibilidad_zona: 100000
  notas_credito: 2500

  # Inventario y ventas conservan proporciones realistas, aunque no son el
  # camino principal del endpoint POST /logistics/pedidos.
  items_inventario: 10000
  registros_compra_producto_tienda: 40000
  registros_venta_producto_tienda: 40000
  productos_externos: 1000
  ventas: 10000
  items_venta: 30000
